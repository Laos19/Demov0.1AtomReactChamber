name: "Copias de seguridad"

on:
  schedule:
    # Diario 08:17 UTC (03:17 hora de Lima): fuera del horario escolar.
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Adjuntar el respaldo a un GitHub Release backup-AAAAMMDD (además del artefacto)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REPORTS: ${{ github.workspace }}/reports
  BACKUP_DIR: ${{ github.workspace }}/backup
  PG_IMAGE: postgres:16

jobs:
  backup:
    name: Respaldo pg_dump + verificación por restauración
    runs-on: ubuntu-latest
    permissions:
      contents: write # solo para crear el Release semanal opcional
    services:
      # Origen de demostración (se usa solo si no hay secret DATABASE_URL).
      source:
        image: postgres:16
        env:
          POSTGRES_DB: atomreactchamber
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Destino de verificación: aquí se restaura SIEMPRE el respaldo.
      restore:
        image: postgres:16
        env:
          POSTGRES_DB: restore_check
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      DEMO_URL: postgres://postgres:postgres@localhost:5432/atomreactchamber
      RESTORE_URL: postgres://postgres:postgres@localhost:5433/restore_check
    steps:
      - uses: actions/checkout@v4

      - name: Determinar modo y política de retención (GFS)
        id: mode
        run: |
          mkdir -p "$REPORTS" "$BACKUP_DIR"
          stamp=$(date -u +%Y%m%d-%H%M)
          day=$(date -u +%d); dow=$(date -u +%u)
          # Abuelo-padre-hijo: diaria 7 días · semanal (domingo) 4 semanas · mensual (día 1) 3 meses.
          if [ "$day" = "01" ]; then tier="mensual"; retention=90
          elif [ "$dow" = "7" ]; then tier="semanal"; retention=30
          else tier="diaria"; retention=7; fi
          if [ -n "$PROD_DATABASE_URL" ]; then mode="produccion"; else mode="demostracion"; fi
          release=false
          if [ "${{ inputs.publish_release }}" = "true" ] || { [ "$tier" != "diaria" ] && [ "${{ vars.BACKUP_RELEASE }}" = "true" ]; }; then
            release=true
          fi
          {
            echo "stamp=$stamp"; echo "tier=$tier"; echo "retention=$retention"
            echo "mode=$mode"; echo "release=$release"
            echo "file=atomreactchamber-$stamp.dump"
            echo "start=$(date +%s)"
          } >> "$GITHUB_OUTPUT"
          echo "Modo: $mode · Nivel: $tier · Retención: $retention días"

      - name: "Demostración: migrar y sembrar BD efímera con Liquibase"
        if: steps.mode.outputs.mode == 'demostracion'
        env:
          LIQUIBASE_COMMAND_URL: jdbc:postgresql://localhost:5432/atomreactchamber
          LIQUIBASE_COMMAND_USERNAME: postgres
          LIQUIBASE_COMMAND_PASSWORD: postgres
        run: .github/scripts/liquibase.sh update

      - name: pg_dump -Fc
        id: dump
        run: |
          src="${PROD_DATABASE_URL:-$DEMO_URL}"
          t0=$(date +%s)
          docker run --rm --network host -e SRC="$src" -v "$BACKUP_DIR:/backup" "$PG_IMAGE" \
            sh -c 'pg_dump --format=custom --compress=9 --no-owner --no-privileges --verbose \
                     --file="/backup/${{ steps.mode.outputs.file }}" "$SRC"' 2> "$REPORTS/pg_dump.log"
          echo "seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
          # Conteos del origen para comparar después.
          docker run --rm --network host -e SRC="$src" -v "$GITHUB_WORKSPACE/.github/scripts:/s:ro" "$PG_IMAGE" \
            psql "$src" -At -F',' -f /s/row-counts.sql > "$REPORTS/conteos-origen.csv"
          docker run --rm --network host "$PG_IMAGE" psql "$src" -At -c "SELECT version();" > "$REPORTS/version-origen.txt"

      - name: Restaurar en PostgreSQL 16 limpio (verificación)
        id: restore
        run: |
          t0=$(date +%s)
          set +e
          docker run --rm --network host -v "$BACKUP_DIR:/backup" "$PG_IMAGE" \
            pg_restore --no-owner --no-privileges --dbname="$RESTORE_URL" "/backup/${{ steps.mode.outputs.file }}" \
            > "$REPORTS/pg_restore.log" 2>&1
          code=$?
          set -e
          echo "seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
          echo "warnings=$(grep -c 'warning\|error' "$REPORTS/pg_restore.log" || true)" >> "$GITHUB_OUTPUT"
          echo "pg_restore terminó con código $code"
          docker run --rm --network host -v "$GITHUB_WORKSPACE/.github/scripts:/s:ro" "$PG_IMAGE" \
            psql "$RESTORE_URL" -At -F',' -f /s/row-counts.sql > "$REPORTS/conteos-restaurado.csv"
          # Listado del contenido del respaldo (TOC).
          docker run --rm -v "$BACKUP_DIR:/backup" "$PG_IMAGE" pg_restore --list "/backup/${{ steps.mode.outputs.file }}" > "$REPORTS/contenido-respaldo.txt"

      - name: Comparar conteos de filas por tabla
        id: compare
        run: node .github/scripts/compare-counts.mjs "$REPORTS/conteos-origen.csv" "$REPORTS/conteos-restaurado.csv" "$REPORTS/verificacion.md"

      - name: Checksum y cifrado
        id: meta
        if: always() && steps.dump.outcome == 'success'
        run: |
          cd "$BACKUP_DIR"
          f="${{ steps.mode.outputs.file }}"
          sha256sum "$f" > "$f.sha256"
          echo "sha256=$(cut -d' ' -f1 "$f.sha256")" >> "$GITHUB_OUTPUT"
          echo "size=$(numfmt --to=iec-i --suffix=B "$(stat -c%s "$f")")" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c%s "$f")" >> "$GITHUB_OUTPUT"
          upload=true
          if [ "${{ steps.mode.outputs.mode }}" = "produccion" ]; then
            if [ -n "$BACKUP_PASSPHRASE" ]; then
              # Datos reales de estudiantes: nunca se suben sin cifrar.
              gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
                --symmetric --cipher-algo AES256 --output "$f.gpg" "$f"
              rm -f "$f"
              sha256sum "$f.gpg" >> "$f.sha256"
              echo "encrypted=true" >> "$GITHUB_OUTPUT"
            else
              rm -f "$f"
              upload=false
              echo "encrypted=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "encrypted=no-aplica" >> "$GITHUB_OUTPUT"
          fi
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
          ls -la

      - name: Reporte de copia de seguridad
        if: always()
        run: |
          total=$(( $(date +%s) - ${{ steps.mode.outputs.start }} ))
          {
            echo "## 💾 Copia de seguridad — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            if [ "${{ steps.mode.outputs.mode }}" = "demostracion" ]; then
              echo "> omitido: falta secret DATABASE_URL — se demuestra la estrategia completa con una BD efímera migrada y sembrada con Liquibase."
              echo ""
            fi
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Modo | ${{ steps.mode.outputs.mode }} |"
            echo "| Archivo | \`${{ steps.mode.outputs.file }}\` (formato custom \`pg_dump -Fc\`, compresión 9) |"
            echo "| Tamaño | ${{ steps.meta.outputs.size || '—' }} |"
            echo "| SHA-256 | \`${{ steps.meta.outputs.sha256 || '—' }}\` |"
            echo "| Cifrado (AES-256, GPG) | ${{ steps.meta.outputs.encrypted || '—' }} |"
            echo "| Origen | $(head -c 60 "$REPORTS/version-origen.txt" 2>/dev/null || echo '—') |"
            echo "| Duración pg_dump | ${{ steps.dump.outputs.seconds || '—' }} s |"
            echo "| Duración restauración | ${{ steps.restore.outputs.seconds || '—' }} s |"
            echo "| Avisos de pg_restore | ${{ steps.restore.outputs.warnings || '—' }} |"
            echo "| Duración total | ${total} s |"
            echo "| Nivel GFS | **${{ steps.mode.outputs.tier }}** → artefacto retenido ${{ steps.mode.outputs.retention }} días |"
            echo ""
            echo "### Política de retención (abuelo-padre-hijo)"
            echo ""
            echo "| Nivel | Cuándo | Se conservan | Implementación |"
            echo "|---|---|---|---|"
            echo "| Diaria | todos los días 03:17 (Lima) | 7 | artefacto con \`retention-days: 7\` |"
            echo "| Semanal | domingos | 4 | artefacto 30 días (+ Release \`backup-AAAAMMDD\` opcional) |"
            echo "| Mensual | día 1 de cada mes | 3 | artefacto 90 días (+ Release opcional) |"
            echo "| PITR | continuo | 6 h | historial de Neon (plan Free) |"
            echo ""
            if [ "${{ steps.meta.outputs.upload }}" = "false" ]; then
              echo "> omitido: falta secret BACKUP_PASSPHRASE — el volcado de producción se verificó pero NO se subió sin cifrar."
              echo ""
            fi
            echo "### Verificación por restauración"
            echo ""
            cat "$REPORTS/verificacion.md" 2>/dev/null || echo "_no se pudo verificar_"
          } | tee "$REPORTS/reporte-backup.md" >> "$GITHUB_STEP_SUMMARY"
          cp "$BACKUP_DIR"/*.sha256 "$REPORTS/" 2>/dev/null || true

      - name: Subir respaldo (artefacto)
        if: steps.meta.outputs.upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ steps.mode.outputs.tier }}-${{ steps.mode.outputs.stamp }}
          path: backup/
          retention-days: ${{ fromJSON(steps.mode.outputs.retention) }}
          compression-level: 0
          if-no-files-found: error

      - name: Subir reporte (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-backup-${{ steps.mode.outputs.stamp }}
          path: reports/
          retention-days: 30

      - name: Release semanal/mensual (opcional)
        if: steps.mode.outputs.release == 'true' && steps.meta.outputs.upload == 'true' && steps.compare.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="backup-$(date -u +%Y%m%d)"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" backup/* \
            --title "Respaldo ${{ steps.mode.outputs.tier }} $(date -u +%F) (${{ steps.mode.outputs.mode }})" \
            --notes-file "$REPORTS/reporte-backup.md" \
            --prerelease --latest=false
          echo "Release publicado: $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Podar Releases antiguos (conserva 4 semanales + 3 mensuales)
        if: steps.mode.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | { grep '^backup-' || true; } | sort -r | tail -n +8 |
            while read -r tag; do
              echo "Eliminando $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done
